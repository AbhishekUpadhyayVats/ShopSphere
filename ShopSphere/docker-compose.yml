version: '3.8'

services:

  # ================= DATABASE =================
  postgres:
    image: postgres:15-alpine
    container_name: postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: root
      POSTGRES_DB: postgres
    ports:
      - "5432:5432"
    command: ["postgres", "-c", "listen_addresses=*"]
    volumes:
      - ./postgres-init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - shopsphere-network

  # ================= REDIS =================
  redis:
    image: redis:7-alpine
    container_name: redis
    ports:
      - "6379:6379"
    networks:
      - shopsphere-network

  # ================= RABBITMQ =================
  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    ports:
      - "5672:5672"
      - "15672:15672"
    networks:
      - shopsphere-network

  # ================= ZIPKIN =================
  zipkin:
    image: openzipkin/zipkin
    container_name: zipkin
    ports:
      - "9411:9411"
    networks:
      - shopsphere-network

  # ================= SONARQUBE (OPTIONAL) =================
  sonarqube:
    image: sonarqube:community
    container_name: sonarqube
    ports:
      - "9000:9000"
    volumes:
      - sonarqube_data:/opt/sonarqube/data
    networks:
      - shopsphere-network

  # ================= EUREKA =================
  eureka-service:
    build:
      context: ./eureka-service
    container_name: eureka-service
    ports:
      - "8761:8761"
    environment:
      - JAVA_TOOL_OPTIONS=-Xmx384m
    networks:
      - shopsphere-network

  # ================= CONFIG SERVER =================
  config:
    build:
      context: ./config-service
    container_name: config
    ports:
      - "8888:8888"
    environment:
      - JAVA_TOOL_OPTIONS=-Xmx384m
    networks:
      - shopsphere-network

  # ================= API GATEWAY =================
  api-gateway-1:
    build:
      context: ./api-gateway-1
    container_name: api-gateway-1
    ports:
      - "8080:8080"
    environment:
      - SPRING_CONFIG_IMPORT=optional:configserver:http://config:8888/config
      - JWT_SECRET=mySelfAbhishekUpadhyayAndCurrentlyIamPersuingBtechInCseFromLpu
      - JAVA_TOOL_OPTIONS=-Xmx384m
      - MANAGEMENT_ZIPKIN_TRACING_ENDPOINT=http://zipkin:9411/api/v2/spans
    command:
      [
        "--eureka.client.service-url.defaultZone=http://eureka-service:8761/eureka",
        "--spring.cloud.gateway.discovery.locator.enabled=true"
      ]
    depends_on:
      - eureka-service
      - config
      - zipkin
    networks:
      - shopsphere-network

  # ================= AUTH SERVICE =================
  auth-service:
    build:
      context: ./auth-service
    container_name: auth-service
    ports:
      - "8081:8081"
    environment:
      - SPRING_CONFIG_IMPORT=optional:configserver:http://config:8888/config
      - JWT_SECRET=mySelfAbhishekUpadhyayAndCurrentlyIamPersuingBtechInCseFromLpu
      - MANAGEMENT_ZIPKIN_TRACING_ENDPOINT=http://zipkin:9411/api/v2/spans
    command:
      [
        "--eureka.client.service-url.defaultZone=http://eureka-service:8761/eureka",
        "--spring.datasource.url=jdbc:postgresql://postgres:5432/shopsphereuser?sslmode=disable",
        "--spring.datasource.username=postgres",
        "--spring.datasource.password=root"
      ]
    depends_on:
      - postgres
      - redis
      - config
      - zipkin
    networks:
      - shopsphere-network

  # ================= CATALOG SERVICE =================
  catalog-service:
    build:
      context: ./catalog-service
    container_name: catalog-service
    ports:
      - "8083:8083"
    environment:
      - SPRING_CONFIG_IMPORT=optional:configserver:http://config:8888/config
      - MANAGEMENT_ZIPKIN_TRACING_ENDPOINT=http://zipkin:9411/api/v2/spans
    command:
      [
        "--eureka.client.service-url.defaultZone=http://eureka-service:8761/eureka",
       "--spring.datasource.url=jdbc:postgresql://postgres:5432/shopspherecatalog?sslmode=disable",
        "--spring.datasource.username=postgres",
        "--spring.datasource.password=root",

        "--spring.redis.host=redis",
        "--spring.rabbitmq.host=rabbitmq"
      ]
    depends_on:
      - postgres
      - redis
      - rabbitmq
      - zipkin
    networks:
      - shopsphere-network

  # ================= ORDER SERVICE =================
  order-service:
    build:
      context: ./order-service
    container_name: order-service
    ports:
      - "8084:8084"
    environment:
      - SPRING_CONFIG_IMPORT=optional:configserver:http://config:8888/config
      - MANAGEMENT_ZIPKIN_TRACING_ENDPOINT=http://zipkin:9411/api/v2/spans
    command:
      [
        "--eureka.client.service-url.defaultZone=http://eureka-service:8761/eureka",
       "--spring.datasource.url=jdbc:postgresql://postgres:5432/shopsphereorder?sslmode=disable",
        "--spring.datasource.username=postgres",
        "--spring.datasource.password=root",

        "--spring.redis.host=redis",       
        "--spring.rabbitmq.host=rabbitmq"   
      ]
    depends_on:
      - postgres
      - redis
      - rabbitmq
      - zipkin
    networks:
      - shopsphere-network

  # ================= ADMIN SERVICE (NO DB) =================
  admin-service:
    build:
      context: ./admin-service
    container_name: admin-service
    ports:
      - "8082:8082"
    environment:
      - SPRING_CONFIG_IMPORT=optional:configserver:http://config:8888/config
      - MANAGEMENT_ZIPKIN_TRACING_ENDPOINT=http://zipkin:9411/api/v2/spans
    command:
      [
        "--eureka.client.service-url.defaultZone=http://eureka-service:8761/eureka"
      ]
    depends_on:
      - zipkin
    networks:
      - shopsphere-network

  # ================= EMAIL SERVICE =================
  email-service:
    build:
      context: ./email-service
    container_name: email-service
    ports:
      - "1000:1000"
    environment:
      - SPRING_MAIL_USERNAME=abhi2002upadhyay@gmail.com
      - SPRING_MAIL_PASSWORD="rxmj atai sgoc vfex"
      - MANAGEMENT_ZIPKIN_TRACING_ENDPOINT=http://zipkin:9411/api/v2/spans
    depends_on:
      - rabbitmq
      - zipkin
    networks:
      - shopsphere-network

# ================= NETWORK =================
networks:
  shopsphere-network:
    driver: bridge

volumes:
    sonarqube_data: